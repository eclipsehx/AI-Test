<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>机械蝴蝶 · Mechanical Butterfly (Three.js)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129419;</text></svg>" />
<style>
  :root{
    --brass:#d9b168; --copper:#c9714b; --sapphire:#5ea8ff; --ink:#07080b;
    --glass:rgba(14,16,22,.62); --line:rgba(217,177,104,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:#efe7d8;
    font-family:"Songti SC","Noto Serif SC",Georgia,"PingFang SC",system-ui,serif}
  canvas{display:block}
  #app{position:fixed;inset:0}
  .ui{position:fixed;z-index:6;pointer-events:none}
  .panel{pointer-events:auto;background:var(--glass);border:1px solid var(--line);
    border-radius:14px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 10px 40px rgba(0,0,0,.55)}

  /* ---------- 标题 ---------- */
  #title{top:calc(12px + env(safe-area-inset-top));left:12px;padding:11px 15px 12px}
  #title h1{margin:0;font-size:19px;letter-spacing:.14em;font-weight:600;
    background:linear-gradient(95deg,#f6e2b4,#d9b168 45%,#8fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #title .sub{margin-top:3px;font-size:10.5px;letter-spacing:.2em;color:#9fb0c4;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace}
  #title .desc{margin-top:7px;font-size:11.5px;line-height:1.65;color:#c8bda8;max-width:230px}

  /* ---------- 右上遥测 ---------- */
  #hud{top:calc(12px + env(safe-area-inset-top));right:12px;padding:9px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.75;color:#b9c6d6;min-width:132px}
  #hud b{color:var(--brass);font-weight:600}
  #hud .sapphire{color:var(--sapphire)}

  /* ---------- 底部控制 ---------- */
  #dock{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:8px;width:min(94vw,760px)}
  #modes{display:flex;gap:6px;padding:6px;flex-wrap:wrap;justify-content:center}
  .btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(217,177,104,.22);background:rgba(255,255,255,.03);
    color:#dccfae;padding:8px 13px;border-radius:9px;font-size:12.5px;letter-spacing:.08em;transition:.22s;
    font-family:inherit;white-space:nowrap}
  .btn:hover{background:rgba(217,177,104,.13);color:#fff4d8}
  .btn.on{background:linear-gradient(180deg,rgba(217,177,104,.34),rgba(217,177,104,.14));color:#fff8e6;
    border-color:rgba(240,214,150,.6);box-shadow:0 0 16px rgba(217,177,104,.22) inset}
  #rail{width:100%;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;display:none}
  #rail>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9b168,#8fd0ff)}
  #filmclock{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#8fa0b3;letter-spacing:.14em;display:none}

  /* ---------- 参数抽屉 ---------- */
  #tune{right:12px;bottom:calc(84px + env(safe-area-inset-bottom));width:212px;padding:11px 13px 13px;display:none}
  #tune.open{display:block}
  #tune h3{margin:0 0 9px;font-size:11px;letter-spacing:.18em;color:#93a4b8;font-weight:500;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace}
  .row{margin:9px 0}
  .row label{display:flex;justify-content:space-between;font-size:11px;color:#c8bda8;margin-bottom:5px}
  .row label span{font-family:ui-monospace,Menlo,monospace;color:var(--brass)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:rgba(217,177,104,.3);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff2cf,#c69a4e);border:1px solid #7a5c26;cursor:pointer;box-shadow:0 0 8px rgba(217,177,104,.55)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:1px solid #7a5c26;border-radius:50%;background:#e8c98a;cursor:pointer}
  .mini{display:flex;gap:5px;margin-top:10px}
  .mini .btn{padding:6px 9px;font-size:11px;flex:1;text-align:center}

  /* ---------- 拆解标注 ---------- */
  .tag{pointer-events:none;transform:translate(-50%,-50%);font-family:ui-monospace,Menlo,monospace;font-size:10.5px;
    color:#ffe9b8;background:rgba(8,10,14,.72);border:1px solid rgba(217,177,104,.42);padding:3px 8px;border-radius:6px;
    letter-spacing:.08em;white-space:nowrap;opacity:0;transition:opacity .3s}
  .tag.show{opacity:.96}
  .tag::before{content:"";position:absolute;left:-16px;top:50%;width:14px;height:1px;background:rgba(217,177,104,.55)}

  /* ---------- 加载 / 错误 ---------- */
  #boot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:radial-gradient(ellipse at 50% 45%,#12161d,#050608 70%);transition:opacity .8s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .ring{width:52px;height:52px;border-radius:50%;border:1px solid rgba(217,177,104,.25);border-top-color:var(--brass);
    animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot p{font-size:12px;letter-spacing:.24em;color:#a9b6c6;margin:0;font-family:ui-monospace,Menlo,monospace}
  #err{max-width:78vw;text-align:center;font-size:12.5px;color:#e8b4a0;line-height:1.8;display:none}
  #err .mini{justify-content:center;display:flex}
  #vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%,transparent 42%,rgba(0,0,0,.55) 100%)}
  #grain{position:fixed;inset:-50%;z-index:4;pointer-events:none;opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    animation:grain 1.1s steps(3) infinite}
  @keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}
  @media (max-width:560px){
    #title .desc{display:none} #hud{min-width:0;font-size:10px} #tune{width:180px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>

<div class="ui panel" id="title">
  <h1>机械蝴蝶</h1>
  <div class="sub">Mech&nbsp;Lepidoptera · Three.js</div>
  <div class="desc">黄铜齿轮 · 镂空紫铜翅膜 · 蓝宝石核心。<br>复刻自 Arena 那段 28 秒演示。</div>
</div>

<div class="ui panel" id="hud">
  <div>振翅 <b id="hHz">0.00</b> Hz</div>
  <div>发条 <b id="hRpm">0.0</b> rpm</div>
  <div>擒纵 <span class="sapphire" id="hTick">—</span></div>
  <div>翼展 <b id="hSpan">–</b> u</div>
  <div>渲染 <b id="hFps">–</b> fps</div>
</div>

<div class="ui" id="dock">
  <div id="filmclock">SHOT 00:00 / 00:28</div>
  <div id="rail"><i></i></div>
  <div class="panel" id="modes">
    <button class="btn" data-mode="film">28 秒镜头</button>
    <button class="btn on" data-mode="idle">静置</button>
    <button class="btn" data-mode="fly">飞行</button>
    <button class="btn" data-mode="explode">拆解</button>
    <button class="btn" data-mode="tune">参数</button>
  </div>
</div>

<div class="ui panel" id="tune">
  <h3>Tuning</h3>
  <div class="row"><label>振翅频率 <span id="vFlap">1.8 Hz</span></label><input id="sFlap" type="range" min="0" max="9" step="0.1" value="1.8"></div>
  <div class="row"><label>发条转速 <span id="vGear">1.0×</span></label><input id="sGear" type="range" min="0" max="4" step="0.05" value="1"></div>
  <div class="row"><label>辉光强度 <span id="vBloom">0.50</span></label><input id="sBloom" type="range" min="0" max="2.2" step="0.05" value="0.5"></div>
  <div class="row"><label>曝光 <span id="vExp">0.95</span></label><input id="sExp" type="range" min="0.4" max="2" step="0.01" value="0.95"></div>
  <div class="mini">
    <button class="btn on" id="bSpin">自转</button>
    <button class="btn" id="bQual">画质·高</button>
    <button class="btn" id="bReset">复位</button>
  </div>
</div>

<div id="boot">
  <div class="ring"></div>
  <p>CASTING GEARS…</p>
  <div id="err">
    <div>无法从 CDN 载入 Three.js（可能是网络限制）。</div>
    <div class="mini"><button class="btn" onclick="location.search='?cdn=unpkg'">改用 unpkg 重试</button></div>
  </div>
</div>

<script>
/* 依赖源可在 URL 上切换：?cdn=unpkg */
(function () {
  var host = new URLSearchParams(location.search).get('cdn') === 'unpkg'
    ? 'https://unpkg.com/three@0.169.0/'
    : 'https://cdn.jsdelivr.net/npm/three@0.169.0/';
  var map = { imports: { three: host + 'build/three.module.js', 'three/addons/': host + 'examples/jsm/' } };
  document.write('<script type="importmap">' + JSON.stringify(map) + '<\/script>');
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============================================================
   0. 基础配置
   ============================================================ */
const CFG = {
  span: 1.9,              // 单侧翼展
  flapHz: 1.8,
  gearRate: 1,
  bloom: 0.5,
  exposure: 0.95,
  autoSpin: true,
  highQuality: true,
};
const REDUCED = matchMedia('(pointer:coarse)').matches; // 触屏默认降一档
if (REDUCED) CFG.highQuality = false;

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: CFG.highQuality, powerPreference: 'high-performance', alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, CFG.highQuality ? 2 : 1.35));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = CFG.exposure;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

/* CSS2D 标注层 */
const css2d = new CSS2DRenderer();
css2d.setSize(innerWidth, innerHeight);
Object.assign(css2d.domElement.style, { position: 'fixed', inset: '0', zIndex: '5', pointerEvents: 'none' });
document.body.appendChild(css2d.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a0f);
scene.fog = new THREE.FogExp2(0x070a0f, 0.085);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 120);
camera.position.set(3.35, 1.75, 5.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.62, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 1.4;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.86;
controls.autoRotateSpeed = 0.42;

/* 环境反射（金属质感的关键） */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

/* ============================================================
   1. 材质库
   ============================================================ */
const M = {
  brass:  new THREE.MeshStandardMaterial({ color: 0xcfa45e, metalness: 1, roughness: 0.26, envMapIntensity: 1.35 }),
  brassDark: new THREE.MeshStandardMaterial({ color: 0x9c7434, metalness: 1, roughness: 0.42, envMapIntensity: 1.1 }),
  copper: new THREE.MeshStandardMaterial({ color: 0xb2603f, metalness: 1, roughness: 0.33, envMapIntensity: 1.2 }),
  steel:  new THREE.MeshStandardMaterial({ color: 0xa9b3bf, metalness: 1, roughness: 0.18, envMapIntensity: 1.5 }),
  iron:   new THREE.MeshStandardMaterial({ color: 0x24262c, metalness: 0.92, roughness: 0.48, envMapIntensity: 0.9 }),
  gold:   new THREE.MeshStandardMaterial({ color: 0xf0d49a, metalness: 1, roughness: 0.14, envMapIntensity: 1.7 }),
  // 不用 transmission：透射会额外渲染整场景，移动端帧率代价过高
  sapphire: new THREE.MeshPhysicalMaterial({
    color: 0x2f6fe0, metalness: 0.15, roughness: 0.06, ior: 1.77, envMapIntensity: 2.6,
    clearcoat: 1, clearcoatRoughness: 0.04, emissive: 0x14408f, emissiveIntensity: 0.85,
    transparent: true, opacity: 0.88, side: THREE.DoubleSide,
  }),
  glass: new THREE.MeshPhysicalMaterial({
    color: 0xbfd9f5, metalness: 0.1, roughness: 0.06, envMapIntensity: 2.2,
    clearcoat: 1, clearcoatRoughness: 0.05, transparent: true, opacity: 0.16,
    side: THREE.DoubleSide, depthWrite: false,
  }),
  glowBlue: new THREE.MeshBasicMaterial({ color: 0x9ad4ff, toneMapped: false }),
  glowAmber: new THREE.MeshBasicMaterial({ color: 0xffce7a, toneMapped: false }),
  wood: new THREE.MeshStandardMaterial({ color: 0x2b211a, metalness: 0.1, roughness: 0.92 }),
};

/* ============================================================
   2. 程序化贴图：翅膜（紫铜镂空 + 脉络 + 鳞粉）
   ============================================================ */
function wingTexture(kind) {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  // 底色：陈旧的紫铜/琥珀
  const base = g.createLinearGradient(0, 0, S, S);
  if (kind === 'fore') { base.addColorStop(0, '#7c4a2c'); base.addColorStop(.45, '#c68a49'); base.addColorStop(1, '#4c2d1e'); }
  else { base.addColorStop(0, '#5d3a2a'); base.addColorStop(.5, '#a9703c'); base.addColorStop(1, '#3a221a'); }
  g.fillStyle = base; g.fillRect(0, 0, S, S);

  // 鳞粉噪点
  const img = g.getImageData(0, 0, S, S), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - .5) * 26;
    d[i] += n; d[i + 1] += n * .8; d[i + 2] += n * .55;
  }
  g.putImageData(img, 0, 0);
  g.filter = 'blur(1px)'; g.drawImage(c, 0, 0); g.filter = 'none';

  // 镂空网格（etching）：细密六边形感觉的交叉线
  g.globalCompositeOperation = 'multiply';
  g.strokeStyle = 'rgba(46,28,16,.30)'; g.lineWidth = 2.4;
  for (let i = -S; i < S * 2; i += 26) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + S, S); g.stroke(); }
  for (let i = -S; i < S * 2; i += 26) { g.beginPath(); g.moveTo(i, S); g.lineTo(i + S, 0); g.stroke(); }
  g.globalCompositeOperation = 'source-over';

  // 主脉与分支脉（亮黄铜）
  const root = { x: S * 0.06, y: S * 0.62 };
  const veins = [];
  const nVein = kind === 'fore' ? 7 : 6;
  for (let i = 0; i < nVein; i++) {
    const a = -1.15 + i * (2.3 / (nVein - 1));
    const L = S * (0.82 + Math.random() * 0.18);
    const ex = root.x + Math.cos(a) * L, ey = root.y + Math.sin(a) * L;
    veins.push([root.x, root.y, (root.x + ex) / 2 + Math.random() * 40 - 20, (root.y + ey) / 2 + Math.random() * 40 - 20, ex, ey]);
  }
  g.lineCap = 'round';
  veins.forEach((v, idx) => {
    g.strokeStyle = idx % 2 ? 'rgba(255,214,140,.85)' : 'rgba(232,180,96,.7)';
    g.lineWidth = 4.2 - idx * 0.25;
    g.beginPath(); g.moveTo(v[0], v[1]); g.quadraticCurveTo(v[2], v[3], v[4], v[5]); g.stroke();
    // 细分支
    for (let b = 0; b < 3; b++) {
      const t = 0.4 + b * 0.2, px = v[0] + (v[4] - v[0]) * t, py = v[1] + (v[5] - v[1]) * t;
      g.lineWidth = 1.3; g.strokeStyle = 'rgba(255,205,130,.5)';
      g.beginPath(); g.moveTo(px, py);
      g.lineTo(px + (Math.random() - .5) * 44, py + (Math.random() - .5) * 44);
      g.stroke();
    }
  });
  // 边缘亮带 + 眼斑
  g.strokeStyle = 'rgba(255,228,170,.55)'; g.lineWidth = 7;
  g.strokeRect(4, 4, S - 8, S - 8);
  const spots = kind === 'fore' ? [[0.66, 0.32], [0.48, 0.5], [0.78, 0.55]] : [[0.55, 0.4], [0.36, 0.6]];
  spots.forEach(([u, v], i) => {
    const r = S * (0.05 + i * 0.012);
    const rg = g.createRadialGradient(u * S, v * S, 1, u * S, v * S, r);
    rg.addColorStop(0, 'rgba(150,220,255,.95)'); rg.addColorStop(.4, 'rgba(70,130,220,.55)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(u * S, v * S, r, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,225,160,.75)'; g.lineWidth = 2.4;
    g.beginPath(); g.arc(u * S, v * S, r * .72, 0, 7); g.stroke();
  });
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

/* 脉络发光遮罩 */
function wingGlowTexture(kind) {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
  const root = { x: S * 0.06, y: S * 0.62 };
  const nVein = kind === 'fore' ? 7 : 6;
  g.lineCap = 'round'; g.shadowColor = '#ffd68a'; g.shadowBlur = 14;
  for (let i = 0; i < nVein; i++) {
    const a = -1.15 + i * (2.3 / (nVein - 1));
    const L = S * 0.9, ex = root.x + Math.cos(a) * L, ey = root.y + Math.sin(a) * L;
    g.strokeStyle = 'rgba(255,215,150,.95)'; g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(root.x, root.y); g.lineTo(ex, ey); g.stroke();
  }
  g.shadowBlur = 10; g.strokeStyle = 'rgba(160,215,255,.75)'; g.lineWidth = 5;
  g.strokeRect(6, 6, S - 12, S - 12);
  const t = new THREE.CanvasTexture(c);
  return t;
}

/* 地板：同心黄铜环 + 暗影 */
function floorTexture() {
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#0a0c10'; g.fillRect(0, 0, S, S);
  const cx = S / 2, cy = S / 2;
  for (let r = 20; r < S / 2; r += 14) {
    g.beginPath(); g.arc(cx, cy, r, 0, 7);
    g.strokeStyle = r % 140 < 14 ? 'rgba(200,160,90,.30)' : 'rgba(120,100,70,.10)';
    g.lineWidth = r % 140 < 14 ? 2.2 : 1; g.stroke();
  }
  // 木纹/磨损
  for (let i = 0; i < 2600; i++) {
    const a = Math.random() * 7, r = Math.random() * S / 2;
    g.fillStyle = `rgba(${90 + Math.random() * 60},${70 + Math.random() * 40},${40 + Math.random() * 30},${Math.random() * .07})`;
    g.fillRect(cx + Math.cos(a) * r, cy + Math.sin(a) * r, Math.random() * 22, 1);
  }
  const rg = g.createRadialGradient(cx, cy, S * .05, cx, cy, S * .5);
  rg.addColorStop(0, 'rgba(255,215,150,.10)'); rg.addColorStop(.55, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.94)');
  g.fillStyle = rg; g.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================================================
   3. 几何工具：齿轮 / 连杆 / 管
   ============================================================ */
function gearShape(teeth, rTip, rRoot) {
  const s = new THREE.Shape();
  const step = (Math.PI * 2) / teeth;
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    const p = [
      [a - step * 0.46, rRoot], [a - step * 0.20, rTip],
      [a + step * 0.20, rTip], [a + step * 0.46, rRoot],
    ].map(([ang, r]) => [Math.cos(ang) * r, Math.sin(ang) * r]);
    p.forEach((q, k) => (i === 0 && k === 0 ? s.moveTo(q[0], q[1]) : s.lineTo(q[0], q[1])));
  }
  s.closePath();
  return s;
}

function gearGeo({ teeth = 18, r = 0.2, thick = 0.05, hole = 0.045, spokes = 0 }) {
  const tip = r, root = r * (1 - 0.16 - 0.5 / teeth);
  const shape = gearShape(teeth, tip, root);
  shape.holes.push(new THREE.Path().absarc(0, 0, Math.max(hole, r * 0.12), 0, Math.PI * 2, true));
  if (spokes > 0) {                                   // 镂空轮辐
    for (let i = 0; i < spokes; i++) {
      const a = (i / spokes) * Math.PI * 2, rr = (r * 0.62);
      const h = new THREE.Path().absarc(Math.cos(a) * rr * 0.66, Math.sin(a) * rr * 0.66, r * 0.2, 0, Math.PI * 2, true);
      shape.holes.push(h);
    }
  }
  const g = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: true, bevelSize: thick * 0.18, bevelThickness: thick * 0.18, bevelSegments: 2, curveSegments: 6 });
  g.translate(0, 0, -thick / 2);
  return g;
}

function tubeFromPoints(pts, rad, seg = 24, closed = false) {
  const curve = new THREE.CatmullRomCurve3(pts, closed, 'catmullrom', 0.4);
  return new THREE.TubeGeometry(curve, Math.max(8, pts.length * 4), rad, seg % 2 ? seg : seg + 1, closed);
}

/* 把一段圆柱放到两点之间（连杆） */
const _dir = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);
function placeLink(rod, A, B) {
  rod.position.copy(A).addScaledVector(B, 1).multiplyScalar(0.5);
  _dir.copy(B).sub(A);
  const len = _dir.length();
  rod.scale.set(1, len, 1);
  rod.quaternion.setFromUnitVectors(_up, _dir.normalize());
  return len;
}

/* 翅膜着色器：薄膜干涉虹彩 + 脉络自发光 + 颤动 */
const wingUniforms = {
  uTime: { value: 0 },
  uOpen: { value: 1 },
  uIrid: { value: new THREE.Color(0x8fd0ff) },
  uWarm: { value: new THREE.Color(0xffc27a) },
  uEnv: { value: null },
};
function wingMaterial(tex, glow) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTex: { value: tex }, uGlow: { value: glow },
      uTime: wingUniforms.uTime, uOpen: wingUniforms.uOpen,
      uIrid: wingUniforms.uIrid, uWarm: wingUniforms.uWarm,
      uFlap: { value: 0 },
    },
    transparent: true, side: THREE.DoubleSide, depthWrite: false,
    vertexShader: /* glsl */`
      varying vec2 vUv; varying vec3 vN; varying vec3 vV; varying float vSpan;
      uniform float uTime, uFlap;
      void main(){
        vUv = uv;
        vec3 p = position;
        // 翼缘由薄到厚的高频微颤
        float span = clamp(p.x / 1.85, 0.0, 1.0);
        vSpan = span;
        float w = sin(uTime*22.0 + p.z*7.0 + span*4.0) * 0.012 * pow(span,3.0) * (0.35 + uFlap);
        p.y += w;
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        vN = normalize(normalMatrix * normal);
        vV = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv; varying vec3 vN; varying vec3 vV; varying float vSpan;
      uniform sampler2D uTex, uGlow;
      uniform float uTime, uOpen, uFlap;
      uniform vec3 uIrid, uWarm;
      void main(){
        vec3 N = normalize(vN) * (gl_FrontFacing ? 1.0 : -1.0);
        float ndv = clamp(abs(dot(N, normalize(vV))), 0.0, 1.0);
        float fres = pow(1.0 - ndv, 3.0);
        vec4 pig = texture2D(uTex, vUv);
        float vein = texture2D(uGlow, vUv).r;

        // 薄膜干涉：随视角与位置连续变色的彩虹
        float ph = ndv * 2.6 + vUv.x * 1.4 - vUv.y * 0.7 + uTime * 0.10;
        vec3 film = 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 0.82, 0.58) * ph + vec3(0.0, 0.36, 0.72)));
        film = mix(film, uIrid, 0.22);

        // 开翼泛冷银、合翼透暖金
        vec3 tint = mix(uIrid, uWarm, clamp(uFlap, 0.0, 1.0));
        vec3 col = pig.rgb * 0.92 + film * (0.10 + 0.34 * fres) + tint * 0.07;
        col += vec3(1.0, 0.84, 0.55) * vein * (0.35 + 0.3 * sin(uTime * 1.3 + vUv.x * 5.0));
        col += film * fres * 0.34;

        float a = 0.72 + 0.24 * fres + 0.18 * vein;
        a *= uOpen;
        a *= 1.0 - smoothstep(0.965, 1.0, vSpan) * 0.4;   // 边缘薄化
        gl_FragColor = vec4(col, clamp(a, 0.0, 1.0));
      }`,
  });
}

const wingTex = { fore: wingTexture('fore'), hind: wingTexture('hind') };
const wingGlow = { fore: wingGlowTexture('fore'), hind: wingGlowTexture('hind') };

/* 单个翅单元：翅面从原点向 +X 展开，前缘朝 +Z */
function buildWingPair(kind, matKind, scale) {
  const side = new THREE.Group();

  const pts = shape.getPoints(90);
  const geo = new THREE.ShapeGeometry(shape, 26);
  geo.computeBoundingBox();
  const bb = geo.boundingBox, sx = bb.max.x - bb.min.x, sy = bb.max.y - bb.min.y;
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i) - bb.min.x) / sx, (uv.getY(i) - bb.min.y) / sy);
  uv.needsUpdate = true;
  geo.rotateX(Math.PI / 2);      // (x,y,0) → (x,0,y)：翅面水平，形状 +y（前缘）→ +Z（朝头）
  geo.computeVertexNormals();

  const membrane = new THREE.Mesh(geo, wingMaterial(wingTex[matKind], wingGlow[matKind]));
  membrane.renderOrder = 2;
  side.add(membrane);

  // 金属外框（沿轮廓）
  const outline3 = pts.map(p => new THREE.Vector3(p.x, 0, p.y));
  const frame = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(outline3, true, 'centripetal'), 170, 0.016, 7, true), M.brass);
  frame.castShadow = true;

  const rgMount = new THREE.Group();
  rgMount.position.set(0.07, 0.02, -0.06);

  horn.position.set(0.07, -0.05, -0.03); horn.rotation.z = 0.5;

function makePoints(count, size, colorFn, spread) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), seed = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = (Math.random() - 0.5) * spread.x;
    pos[i * 3 + 1] = Math.random() * spread.y;
    pos[i * 3 + 2] = (Math.random() - 0.5) * spread.z;
    seed[i] = Math.random();
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSize: { value: size }, uOpacity: { value: 1 }, uColor: { value: colorFn } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute float aSeed; uniform float uTime,uSize; varying float vA;
      void main(){
        vec3 p = position;
        p.y += sin(uTime*0.35 + aSeed*6.28)*0.22;
        p.x += cos(uTime*0.24 + aSeed*12.0)*0.18;
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        gl_PointSize = min(26.0, uSize * (0.5 + aSeed*0.6) * (14.0 / max(1.2, -mv.z)));
        vA = 0.06 + 0.20*abs(sin(uTime*1.2 + aSeed*20.0));
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uColor; uniform float uOpacity; varying float vA;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        if(d>0.5) discard;
        float a = smoothstep(0.5,0.0,d)*vA*uOpacity;
        gl_FragColor = vec4(uColor, a);
      }`,
  });
  const pts = new THREE.Points(g, mat);
  pts.frustumCulled = false;
  return pts;
}

function updateWings(t, dt) {
  const hz = CFG.flapHz * (mode === 'fly' ? 2.1 : 1);
  const w = 2 * Math.PI * hz;
  const s = Math.sin(t * w);
  // 归一化开合度：合翼(0) → 开翼(1)
  flapAmp += ((0.5 - 0.5 * Math.cos(t * w)) - flapAmp) * Math.min(1, dt * 14);
  const base = mode === 'fly' ? 1.18 : (mode === 'idle' ? 0.86 : 0.95);
  const amp = base * openK;
  // 下拍快、上拍慢（真实昆虫的非对称冲程）
  const stroke = Math.pow(Math.max(0, s), 0.72) - Math.pow(Math.max(0, -s), 1.35);
  const flutter = Math.sin(t * 26) * 0.03 * (mode === 'fly' ? 1 : 0.4);

  wings.forEach((wg) => {
    const hind = wg.kind === 'hind';
    const phase = hind ? -0.34 : 0;
    const ang = (stroke * Math.cos(phase) + flutter * (hind ? 1.4 : 1)) * amp * 1.05;
    // +X 侧上抬 = 正 Z 旋转；镜像侧反向
    wg.pivot.rotation.z = ang * (hind ? 0.82 : 1);
    wg.pivot.rotation.y = -amp * 0.2 * Math.sin(t * w * 0.5 + 1.0 + phase);
    wg.pivot.rotation.x = 0.07 * Math.sin(t * w + phase) * amp;
    wg.built.rootGear.mesh.rotation.z = -ang * 2.2;   // 翅根齿轮跟随

    const u = wg.built.membrane.material.uniforms;
    u.uFlap.value = flapAmp;
    u.uTime.value = t;

    // 液压关节：外筒随翅角倾斜，活塞杆在筒内伸缩（长度严格受限）
    const hyd = wg.built.hydraulic;
    const tilt = 0.42 + ang * 0.5;
    hyd.cyl.position.set(0.055, -0.045, -0.02);
    hyd.cyl.rotation.z = tilt;
    const ext = THREE.MathUtils.clamp(0.035 + amp * 0.03 * (0.5 + 0.5 * stroke), 0.02, 0.075);
    hyd.piston.scale.y = 1;
    hyd.piston.position.set(
      0.055 - Math.sin(tilt) * (0.06 + ext),
      -0.045 - Math.cos(tilt) * (0.06 + ext),
      -0.02
    );
    hyd.piston.rotation.z = tilt;
  });

  // 曲柄圆周运动 → 四根推杆始终指向翅根
  const cR = 0.05, cA = trainAngle * 2.2;
  crankL.position.set(cR, 0.125 + Math.cos(cA) * cR, -0.02 + Math.sin(cA) * cR);
  crankR.position.set(-cR, 0.125 + Math.cos(-cA) * cR, -0.02 + Math.sin(-cA) * cR);
  const lift = flapAmp * 0.06;
  placeLink(rodL, crankL.position, _tmpA.set(0.2, 0.06 + lift, 0.17));
  placeLink(rodR, crankR.position, _tmpB.set(-0.2, 0.06 + lift, 0.17));
  placeLink(rodF, _tmpA.copy(crankL.position).set(0, 0.125 + Math.sin(cA) * cR, 0.14), _tmpB.set(0.2, 0.06 + lift, 0.17));
  placeLink(rodB, _tmpA.copy(crankR.position).set(0, 0.125 + Math.cos(cA) * cR, 0.14), _tmpB.set(-0.2, 0.06 + lift, 0.17));
}

function updateLegs(t) {
  legs.forEach(l => {
    const sway = Math.sin(t * 1.4 + l.phase) * 0.05;
    l.hip.rotation.z = -0.1 * l.s + sway;
    l.knee.rotation.z = 0.35 * l.s + sway * 2;
    // 开场前足拂尘
    if (dustFlick > 0 && l.i === 0 && l.s > 0) {
      l.hip.rotation.x = -0.9 * dustFlick * Math.sin(t * 9);
    } else l.hip.rotation.x *= 0.95;
  });
}

function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
const _kp = new THREE.Vector3(), _kl = new THREE.Vector3();
function filmPose(time) {
  let i = 0; while (i < keys.length - 2 && keys[i + 1].t < time) i++;
  const a = keys[i], b = keys[i + 1];
  const k = ease(THREE.MathUtils.clamp((time - a.t) / (b.t - a.t), 0, 1));
  _kp.set(...a.p).lerp(new THREE.Vector3(...b.p), k);
  _kl.set(...a.look).lerp(new THREE.Vector3(...b.look), k);
  return { pos: _kp, look: _kl, fov: THREE.MathUtils.lerp(a.fov, b.fov, k) };
}

let fpsAcc = 0, fpsN = 0, lastHud = 0;
let lastWall = performance.now();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  const wall = Math.min((performance.now() - lastWall) / 1000, 0.5);
  lastWall = performance.now();

  // 展翅开合插值
  openK += (openTarget - openK) * Math.min(1, dt * 6);
  wingUniforms.uOpen.value = openK;

  // 拆解插值
  explodeK += (explodeTarget - explodeK) * Math.min(1, dt * 2.4);
  const ek = ease(THREE.MathUtils.clamp(explodeK, 0, 1));
  explodeParts.forEach(p => {
    p.obj.position.copy(p.obj.userData.home).addScaledVector(p.dir, p.dist * ek);
    if (p.lab) p.lab.classList.toggle('show', ek > 0.18);
  });

  updateMovement(dt, t);
  if (flapKick > 0) flapKick = Math.max(0, flapKick - dt * 1.6);
  updateWings(t, dt);
  updateLegs(t);

  // 尘埃：开场 4 秒内拂起
  dustFlick = Math.max(0, 1 - Math.abs(t - 2.6) / 2.2) * (mode !== 'fly' ? 1 : 0);
  dust.material.uniforms.uTime.value = t;
  dust.material.uniforms.uOpacity.value = 0.25 + 0.55 * Math.max(0, 1 - t / 6);
  sparks.material.uniforms.uTime.value = t * 1.4;
  sparks.material.uniforms.uOpacity.value = mode === 'fly' ? 0.5 : 0.22;
  beams.forEach((b, i) => { b.material.opacity = 0.008 + 0.006 * Math.sin(t * 0.4 + i); });

  // 模式行为
  if (mode === 'fly') {
    flyT += dt;
    const p = flyPath(flyT);
    const p2 = flyPath(flyT + 0.08);
    butterfly.position.lerp(p.add(new THREE.Vector3(0, 0.62, 0)), Math.min(1, dt * 4));
    const look = new THREE.Vector3().copy(flyPath(flyT + 0.3)).add(new THREE.Vector3(0, 0.62, 0));
    _tmpA.copy(butterfly.position);
    const yaw = Math.atan2(look.x - _tmpA.x, look.z - _tmpA.z);
    butterfly.rotation.y += (yaw - butterfly.rotation.y) * Math.min(1, dt * 3);
    // 转弯侧倾
    const turn = (flyPath(flyT + 0.3).x - flyPath(flyT - 0.3).x);
    butterfly.rotation.z += (-turn * 0.25 - butterfly.rotation.z) * Math.min(1, dt * 2.4);
    butterfly.rotation.x = 0.1 + Math.sin(flyT * 2.2) * 0.05;
    controls.target.lerp(butterfly.position, Math.min(1, dt * 3));
  } else if (mode === 'film') {
    if (playing) {
      filmT += wall;
      if (filmT >= SHOT) { filmT = SHOT; playing = false; setMode('idle'); }
    }
    const pose = filmPose(filmT);
    _tmpB.copy(pose.pos).multiplyScalar(camera.userData.pdist || 1);
    camera.position.lerp(_tmpB, Math.min(1, dt * 3.2));
    controls.target.lerp(pose.look, Math.min(1, dt * 3.2));
    camera.lookAt(pose.look);
    camera.fov = THREE.MathUtils.lerp(camera.fov, pose.fov * (camera.userData.portrait || 1), Math.min(1, dt * 2.5));
    camera.updateProjectionMatrix();
    ui.railFill.style.width = (filmT / SHOT * 100).toFixed(1) + '%';
    ui.clock.textContent = 'SHOT ' + fmtT(filmT) + ' / 00:28';
    // 剧本事件：起飞 / 升空
    const stage3 = filmT > 8 && filmT < 24;
    if (stage3) {
      const ft = (filmT - 8) * 0.55;
      const p = flyPath(ft * 0.85);
      butterfly.position.lerp(new THREE.Vector3(p.x, p.y + 0.2, p.z), Math.min(1, dt * 2.6));
      butterfly.rotation.y += (Math.atan2(flyPath(ft * 0.85 + 0.2).x - p.x, flyPath(ft * 0.85 + 0.2).z - p.z) - butterfly.rotation.y) * dt * 2;
    } else {
      butterfly.position.lerp(new THREE.Vector3(0, 0.62, 0), Math.min(1, dt * 2));
      butterfly.rotation.y += (0 - butterfly.rotation.y) * dt * 2;
    }
    if (filmT > 24) {
      // 仰拍剪影：拉远 + 压暗曝光
      renderer.toneMappingExposure = THREE.MathUtils.lerp(renderer.toneMappingExposure, CFG.exposure * 0.62, dt * 1.4);
    } else {
      renderer.toneMappingExposure = THREE.MathUtils.lerp(renderer.toneMappingExposure, CFG.exposure, dt * 1.4);
    }
  } else {
    butterfly.position.lerp(_tmpB.set(0, 0.62, 0), Math.min(1, dt * 2.5));
    butterfly.rotation.x += (0 - butterfly.rotation.x) * dt * 2;
    butterfly.rotation.z += (0 - butterfly.rotation.z) * dt * 2;
    if (mode !== 'explode') butterfly.rotation.y += dt * 0.05;
    renderer.toneMappingExposure = THREE.MathUtils.lerp(renderer.toneMappingExposure, CFG.exposure, dt * 2);
  }

  controls.autoRotate = (mode === 'idle' || mode === 'explode') && CFG.autoSpin;
  if (controls.enabled) controls.update();

  composer.render();
  css2d.render(scene, camera);

  // HUD
  fpsAcc += dt; fpsN++;
  if (t - lastHud > 0.4) {
    lastHud = t;
    const fps = Math.round(fpsN / fpsAcc);
    ui.hFps.textContent = fps; fpsAcc = 0; fpsN = 0;
    autoQuality(fps);
    ui.hHz.textContent = (CFG.flapHz * (mode === 'fly' ? 2.1 : 1) * openK).toFixed(2);
    const rpm = CFG.gearRate * 0.55 * 60 / (2 * Math.PI) * Math.abs(RATIOS[4][1]);
    ui.hRpm.textContent = rpm.toFixed(1);
    ui.hTick.textContent = '▶ ' + String(Math.floor(Math.abs(trainAngle * RATIOS[4][1]) * 15 / Math.PI) % 60).padStart(2, '0');
  }
  requestAnimationFrame(tick);
}
function fmtT(s) {
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}
let flyT = 0;

/* 实测翼展 */
const _box = new THREE.Box3().setFromObject(butterfly);
ui.hSpan.textContent = (_box.max.x - _box.min.x).toFixed(2);

/* 自适应画质：连续掉帧则自动降一档 */
let lowStreak = 0;
function autoQuality(fps) {
  if (!CFG.highQuality || fps === 0) return;
  lowStreak = fps < 26 ? lowStreak + 1 : 0;
  if (lowStreak > 6) {
    lowStreak = 0;
    CFG.highQuality = false;
    renderer.setPixelRatio(1);
    key.castShadow = false;
    bloom.enabled = false;
    sparks.visible = false;
    const b = el('bQual'); b.textContent = '画质·省电'; b.classList.add('on');
  }
}

/* 启动 */
resize();
camera.position.multiplyScalar(camera.userData.pdist || 1);
requestAnimationFrame(() => {
  tick();
  setTimeout(() => boot.classList.add('gone'), 240);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.getDelta(); });
window.__ready = true;
</script>

<script>
/* 载入失败兜底提示 */
setTimeout(() => {
  if (!window.__ready) {
    document.querySelector('#boot p').textContent = 'LOADING…';
    document.getElementById('err').style.display = 'block';
  }
}, 9000);
addEventListener('error', e => {
  if (!window.__ready) {
    document.getElementById('err').style.display = 'block';
    document.querySelector('#boot p').textContent = 'CDN BLOCKED';
  }
});
</script>
